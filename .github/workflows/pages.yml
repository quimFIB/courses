name: pages

# No paths: filter. In a monorepo the list would have to be course-prefixed and
# would have to know that one builder lives under slides/ and the other under
# mrlib/; its failure mode is silent, and the build is standard-library Python
# over committed files. Rebuilding on every push to main is the cheaper mistake.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_all.py discovers the courses by their course.json. It never names
      # one, so adding or removing a course is a mv and nothing else.
      - run: python site/build_all.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
