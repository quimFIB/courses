[project]
name = "qclib"
version = "0.1.0"
description = "The optional referee for the quantum computing course: a small statevector and density-matrix simulator, NumPy only."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qclib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
